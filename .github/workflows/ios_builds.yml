name: 🍏 iOS
on:
  workflow_call:

jobs:
  build-and-export:
    #timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { platform: ios, arch: arm64, os: macos-latest, upload-artifact: false }
          ]
        #target-type: [template_debug, template_release, profile, production]
        #float-precision: [single, double]
        target-type: [production]
        float-precision: [single]
        
    runs-on: ${{ matrix.target.os }}
    steps:
      # Clone this repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
         
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      # Setup dependencies
      - name: Setup godot-cpp
        uses: ./engine/godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh engine/godot/misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true
    
      - name: Download pre-built AccessKit
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: AccessKit/accesskit-c
          version: tags/0.16.0
          file: accesskit-c-0.16.0.zip
          target: thirdparty/accesskit/accesskit-c-0.16.0/accesskit_c.zip

      - name: Extract pre-built AccessKit
        run: | 
          unzip -o thirdparty/accesskit/accesskit-c-0.16.0/accesskit_c.zip -d thirdparty/accesskit/
          
      - name: Setup Workflow Variables + Environment
        run: |
          python tools/scripts/write_to_github_actions_environment.py
          python -m pip install psutil
    
      # Restore .scons_cache
      - name: Restore .scons_cache
        uses: ./engine/godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons_cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}
      
      # Build Engine + GDExtension (with caches)
      - name: Build Project
        shell: sh
        run: |
          python tools/scripts/build.py ${{ matrix.target.platform }} ${{ matrix.target-type }} ${{ matrix.target.arch }} ${{ matrix.float-precision }} True ${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
      
      - name: Create Custom Export Template
        if: ${{ matrix.target.upload-artifact }}
        shell: sh
        run: |
          python tools/scripts/create_custom_export_template.py ${{ matrix.target.platform }} ${{ matrix.target-type }} ${{ matrix.target.arch }} ${{ matrix.float-precision }} True ${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
      
      # Save scons cache
      - name: Save .scons_cache
        uses: ./engine/godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons_cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}
        continue-on-error: true
      
      - name: Unit Tests
        if: ${{ matrix.target-type == 'template_debug' }}
        timeout-minutes: 2
        run: |
          python tools/scripts/run_unit_tests.py ${{ matrix.target.platform }} ${{ matrix.target-type }} ${{ matrix.target.arch }} ${{ matrix.float-precision }} True
        continue-on-error: true

      # Can comment if you are part of the apple developer program
      #- name: Export Project
      #  if: ${{ matrix.target.upload-artifact }}
      #  shell: sh
      #  run: |
      #    python tools/scripts/export.py ${{ matrix.target.platform }} ${{ matrix.target-type }} ${{ matrix.target.arch }} ${{ matrix.float-precision }} True
      
      # Upload the build
      #- name: Upload Artifact
      #  if: ${{ matrix.target.upload-artifact }}
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: game_${{ matrix.target.platform }}_${{ matrix.target-type }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ env.BUILD_TIME }}_${{ github.ref_name }}_${{ env.SHA_SHORT }}
      #    path: |
      #      ${{ github.workspace }}/bin/${{ matrix.target.platform }}/**
      #    retention-days: 2